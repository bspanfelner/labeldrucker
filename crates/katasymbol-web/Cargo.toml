[package]
name = "katasymbol-web"
description = "Web Bluetooth link and browser bindings for Katasymbol E16 label printers"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
katasymbol-core.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Navigator", "Performance", "Event", "EventTarget",
    "Bluetooth", "BluetoothDevice", "BluetoothRemoteGattServer",
    "BluetoothRemoteGattService", "BluetoothRemoteGattCharacteristic",
    "RequestDeviceOptions",
] }
