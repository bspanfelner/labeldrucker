[package]
name = "katasymbol-webapp"
description = "The Katasymbol app as a WebAssembly module (Web Bluetooth)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.92"
publish = false

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
katasymbol-app = { path = "../katasymbol-app" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
