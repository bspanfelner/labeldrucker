[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
katasymbol-core = { path = "crates/katasymbol-core" }
katasymbol-linux = { path = "crates/katasymbol-linux" }
katasymbol-btle = { path = "crates/katasymbol-btle" }
katasymbol-web = { path = "crates/katasymbol-web" }
thiserror = "2"

# Small, fast downloads for the web build (`cargo build --profile web`).
[profile.web]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
