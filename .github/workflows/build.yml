# Builds every platform. Runs on tags (v*) and on demand (Actions → Build → Run workflow).
# Tags also publish a GitHub release; the web app goes to GitHub Pages
# (Settings → Pages → Source: GitHub Actions).
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install cargo-zigbuild
      - run: ./scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/*.tar.gz }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      - run: ./scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: "dist/*.zip\ndist/*.dmg" }

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - name: wasm-bindgen CLI (same version as Cargo.lock)
        run: |
          v=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
          cargo install wasm-bindgen-cli --version "$v" --locked
      - run: ./scripts/package-web.sh
      - uses: actions/upload-artifact@v4
        with: { name: web, path: dist/*.zip }
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }

  pages:
    needs: web
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: "dist/*" }
