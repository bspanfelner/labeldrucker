<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#1b1b1b">
<title>Katasymbol</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1b1b; color: #ddd;
               font: 15px/1.5 system-ui, sans-serif; }
  canvas#app { position: absolute; inset: 0; width: 100%; height: 100%; outline: none; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; }
  #loading small { color: #999; display: block; margin-top: 8px; max-width: 34em; }
  #nobt { display: none; color: #ffb74d; }
</style>
</head>
<body>
<canvas id="app"></canvas>
<div id="loading">
  <div>
    Katasymbol wird geladen …
    <small id="nobt">Dieser Browser kann kein Web Bluetooth. Zum Drucken bitte Chrome oder Edge
    verwenden (auf dem iPhone den Browser „Bluefy“). Gestalten geht trotzdem.</small>
  </div>
</div>
<script type="module">
  if (!navigator.bluetooth) document.getElementById("nobt").style.display = "block";
  import init from "./pkg/katasymbol_webapp.js";
  init();
</script>
</body>
</html>
