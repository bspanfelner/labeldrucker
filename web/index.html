<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1b1b1b">
<meta http-equiv="Cache-Control" content="no-cache">
<title>Katasymbol</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1b1b; color: #ddd;
               font: 15px/1.5 system-ui, sans-serif; }
  canvas#app { position: absolute; inset: 0; width: 100%; height: 100%; outline: none; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; }
  #loading small { color: #999; display: block; margin-top: 8px; max-width: 34em; }
  #loading { pointer-events: none; }
  #loading.problem { pointer-events: auto; }
  #nobt { display: none; color: #ffb74d; }
  #problem { display: none; color: #ff8a80; max-width: 36em; margin-top: 12px; }
  /* eframe's hidden text input: 16px keeps iOS from zooming in on focus. */
  body > input[type=text] { font-size: 16px; }
  #problem code { background: #333; padding: 2px 6px; border-radius: 4px; color: #eee; }
</style>
</head>
<body>
<canvas id="app"></canvas>
<div id="loading">
  <div>
    Katasymbol wird geladen …
    <small id="build"></small>
    <small id="nobt">Dieser Browser kann kein Web Bluetooth. Zum Drucken bitte Chrome oder Edge
    verwenden (auf dem iPhone den Browser „Bluefy“). Gestalten geht trotzdem.</small>
    <div id="problem"></div>
  </div>
</div>
<script type="module">
  const problem = (html) => {
    const p = document.getElementById("problem");
    p.innerHTML = html;
    p.style.display = "block";
    document.getElementById("loading").classList.add("problem");
  };
  if (!navigator.bluetooth) document.getElementById("nobt").style.display = "block";
  if (location.protocol === "file:") {
    // Browsers refuse to load WebAssembly modules from the local disk.
    problem(`Die Seite wurde direkt als Datei geöffnet – so lädt der Browser die App nicht.<br><br>
      Bitte über einen Webserver öffnen, z. B. im Ordner <code>web</code>:<br>
      <code>python3 -m http.server 8090</code><br>dann <code>http://localhost:8090</code> aufrufen.`);
  } else {
    try {
      // Ask the server for the current build every time, and load the app
      // under a URL that names it: a cached older app is never reused.
      let build = String(Date.now());
      try {
        const r = await fetch("./pkg/build.txt", { cache: "no-store" });
        if (r.ok) build = (await r.text()).trim();
      } catch {}
      document.getElementById("build").textContent = "Version " + build;
      const v = encodeURIComponent(build);
      const app = await import(`./pkg/katasymbol_webapp.js?v=${v}`);
      await app.default({ module_or_path: `./pkg/katasymbol_webapp_bg.wasm?v=${v}` });
      // iOS shows the keyboard only for a focus inside the tap itself; egui
      // focuses its text input a frame later. So on a tap on a text field,
      // focus that input right here. Capture phase: eframe stops the event
      // from bubbling.
      window.addEventListener("touchend", (e) => {
        const t = e.changedTouches[0];
        const canvas = document.getElementById("app");
        const box = canvas.getBoundingClientRect();
        if (!t || !app.text_field_at(t.clientX - box.left, t.clientY - box.top, box.width)) return;
        const input = document.querySelector("body > input[type=text]");
        if (input) { input.blur(); input.focus(); }
      }, { capture: true });
    } catch (e) {
      console.error(e);
      problem(`Die App konnte nicht starten:<br><code>${String(e?.message ?? e)}</code>`);
    }
  }
</script>
</body>
</html>
